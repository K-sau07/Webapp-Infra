name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checked out repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Ran tests
        run: mvn test

  build:
    name: Build JAR
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checked out repository
        uses: actions/checkout@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Built JAR artifact
        run: mvn package -DskipTests

      - name: Uploaded artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-jar
          path: target/webapp-1.0.0.jar

  packer:
    name: Build AMI with Packer
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checked out repository
        uses: actions/checkout@v3

      - name: Downloaded artifact
        uses: actions/download-artifact@v4
        with:
          name: webapp-jar
          path: target

      - name: Configured AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Set up Packer
        uses: hashicorp/setup-packer@main
        with:
          version: latest

      - name: Initialized Packer plugins
        run: packer init .

      - name: Validated Packer template
        run: packer validate machine.pkr.hcl

      - name: Built AMI
        run: |
          BUILD_TIMESTAMP=$(date -u +"%Y%m%dT%H%M%S")
          packer build -var "build_timestamp=$BUILD_TIMESTAMP" machine.pkr.hcl
